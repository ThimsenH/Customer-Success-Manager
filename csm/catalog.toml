# Module catalog: the outcome KPIs per Electrification X module.
#
# One entry per KPI. Adding a module or KPI here is enough for the generator,
# metrics, health score and dashboard to pick it up. Rules in rules.toml refer
# to a KPI as kpi_<MODULE>_<id>, e.g. kpi_DGM_autonomous_share.
#
#   better  = "higher" or "lower"
#   target  = the level that counts as full value (health score 100 for this KPI)
#   healthy = typical value at a customer that uses the module well (synthetic data)
#   unit    = share | minutes | hours | per_week | count
#
# OT Companion is not in this file: it has its own, more detailed data (otc_weekly).

# --- Asset Management ------------------------------------------------------------
[[kpi]]
module = "ASSET"
id = "monitored_share"
name = "Assets under condition monitoring"
unit = "share"
better = "higher"
target = 0.80
healthy = 0.86

